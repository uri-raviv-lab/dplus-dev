name: Create the DPlus Installer
on:
  push:
    tags:
      - dplus-v*

jobs:
  windows-build:
    runs-on: windows-latest
    name: Build the DPlus Installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Update Version
        working-directory: .
        run: ./version-update.ps1 -version ${{ github.ref }}

      - name: Checkout LFS objects
        run: |
          git lfs pull
          git lfs checkout

      - name: Install boost
        run: |
          Invoke-WebRequest https://boost.teeks99.com/bin/1.79.0/boost_1_79_0-msvc-14.3-64.exe -OutFile boost-setup.exe
          .\boost-setup.exe /DIR=boost /SILENT | Out-Null
          move boost\lib64-msvc-14.3 boost\lib64

      - name: Set up CUDA
        uses: Jimver/cuda-toolkit@v0.2.24
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup nuget
        uses: nuget/setup-nuget@v2

      - name: Restore nuget packages
        run: nuget restore Dplus.sln

      - name: Compile Backend - Release
        env:
          BOOST_ROOT: ${{ github.workspace }}/boost
        run: |
          msbuild Dplus.sln /p:Configuration=Release /p:Platform=x64 /t:Backend\Backend:Rebuild

      - name: Compile Backend - Debug
        env:
          BOOST_ROOT: ${{ github.workspace }}/boost
        run: |
          msbuild Dplus.sln /p:Configuration=ReleaseWithDebugInfo /p:Platform=x64 /t:Backend\Backend:Rebuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
          architecture: x64

      - name: Build Python wheels
        working-directory: PythonInterface
        run: |
          python -m pip install --upgrade pip<24
          pip install setuptools<66
          pip install -r requirements.txt
          pip install wheel
          ./rebuild-wheels.ps1

      - name: Build Extra Utilities
        env:
          BOOST_ROOT: ${{ github.workspace }}/boost
        run: |
          msbuild dplus.sln /p:Configuration=Release /p:Platform=x64 /t:Miscellaneous\PDBUnits
          msbuild dplus.sln /p:Configuration=Release /p:Platform=x64 /t:Miscellaneous\DebyeCalculator
          msbuild dplus.sln /p:Configuration=Release /p:Platform=x64 "/t:Miscellaneous\Suggest Parameters"

      - name: Build DPlus
        env:
          BOOST_ROOT: ${{ github.workspace }}/boost
        run: msbuild dplus.sln /p:Configuration=Release /p:Platform=x64 "/t:User Interface\DPlus"

      - name: Copy CUDA DLL for Installer
        run: |
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cudart64_12.dll" x64\Release\

      - name: Build Installer (MSI)
        env:
          BOOST_ROOT: ${{ github.workspace }}/boost
          GITHUB_VERSION: ${{ github.ref }}
        run: ./build-installer.ps1

      # -----------------------------
      # Copy wrapper.py to MSI folder
      # -----------------------------

      - name: Copy wrapper.py to MSI folder
        run: copy wrapper.py Installer/bin/x64/release/en-us/

      # -----------------------------
      # Rename MSI to Dplus.installer.msi
      # -----------------------------
      - name: Rename MSI for EXE Wrapper
        run: ren Installer/bin/x64/release/en-us/*.msi Dplus.installer.msi

      # -----------------------------
      # Build EXE Wrapper
      # -----------------------------
      - name: Build EXE Wrapper
        working-directory: Installer/bin/x64/release/en-us
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller --clean --onefile --add-data "Dplus.installer.msi;." --uac-admin --name "Dplus.installer" wrapper.py --console

      # # -----------------------------
      # # Upload MSI to Release
      # # -----------------------------
      # - name: Upload MSI to Release
      #   uses: svenstaro/upload-release-action@v2
      #   with:
      #     repo_token: ${{ secrets.GITHUB_TOKEN }}
      #     file: Installer/bin/x64/release/en-us/*.msi
      #     file_glob: true
      #     tag: ${{ github.ref }}
      #     overwrite: true
      #     body: "D+ Installer (MSI)"

      # -----------------------------
      # Upload EXE to Release
      # -----------------------------
      - name: Upload EXE to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Installer/bin/x64/release/en-us/dist/*.exe
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          body: "D+ EXE Wrapper"